name: Daily Flight Snapshot

on:
  schedule:
    # Once daily at 20:00 UTC — insurance snapshot only, not live polling.
    - cron: "0 20 * * *"
  workflow_dispatch: {}

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run daily snapshot
        env:
          AVIATIONSTACK_API_KEY: ${{ secrets.AVIATIONSTACK_API_KEY }}
          FLIGHT_NUMBERS: "EY239,EY153,EY156,EY232"
        run: python daily_snapshot.py

      - name: Commit updated history
        run: |
          git config user.name "flight-tracker-bot"
          git config user.email "actions@github.com"
          git add data/flight_history.csv
          git diff --staged --quiet || git commit -m "Daily snapshot update"
          git push
